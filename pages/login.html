<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — DevMentor AI</title>
  <link rel="stylesheet" href="../assets/css/style.css?v=2" />
  <link rel="stylesheet" href="../assets/css/components.css?v=2" />
  <link rel="stylesheet" href="../assets/auth.css?v=2" />
</head>
<body>
  <!-- Visível só até o Firebase confirmar se já existe sessão -->
  <div id="authChecking" class="auth-shell">
    <p class="auth-hint">Verificando sessão...</p>
  </div>
 
  <div class="auth-shell" id="authShell" hidden>
    <div class="auth-card">
      <a href="../index.html" class="brand auth-brand">
        <span class="brand-mark" aria-hidden="true">&lt;/&gt;</span>
        DevMentor <span class="text-gradient">AI</span>
      </a>
      <p class="auth-copy">Entre para acessar o chat com IA, seu plano de estudos e seu painel de evolução.</p>
 
      <div class="auth-toggle" role="tablist" aria-label="Alternar modo de autenticação">
        <button class="auth-tab active" data-auth-mode="login" type="button" role="tab" aria-selected="true">Entrar</button>
        <button class="auth-tab" data-auth-mode="signup" type="button" role="tab" aria-selected="false">Criar conta</button>
      </div>
 
      <form id="authForm" class="auth-form" novalidate action="#" method="post" onsubmit="return false;">
        <div class="field-group">
          <label for="displayName">Nome</label>
          <input id="displayName" name="displayName" type="text" autocomplete="name" placeholder="Seu nome" />
        </div>
        <div class="field-group">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="seu@email.com" required />
        </div>
        <div class="field-group">
          <label for="password">Senha</label>
          <input id="password" name="password" type="password" autocomplete="current-password" minlength="6" placeholder="Mínimo 6 caracteres" required />
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="authSubmit">Entrar</button>
      </form>
 
      <button class="btn btn-ghost btn-block" type="button" id="googleButton" style="margin-top:12px;">Entrar com Google</button>
      <button class="btn btn-ghost btn-block" type="button" id="resetPasswordButton" style="margin-top:8px;">Recuperar senha</button>
 
      <p id="authStatus" class="auth-status" role="status" aria-live="polite">Pronto para entrar.</p>
      <p class="auth-hint">Seu acesso será salvo de forma persistente e protegido pelo Firebase.</p>
      <p class="auth-hint"><a href="#" id="forceLogoutLink">Não é você? Sair da sessão atual</a></p>
    </div>
  </div>
 
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script type="module" src="../assets/firebase-init.js"></script>
<script type="module" src="../utils/authGuard.js"></script>
  <script type="module" src="../assets/js/auth-flow.js"></script>
  <script type="module" src="../assets/js/main.js"></script>
</body>
</html>
